<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
      --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>

<body>
    <body class="bg-slate-50 font-sans antialiased dark:bg-neutral-950">
        <main class="min-h-screen flex items-center justify-center px-4 py-8 md:px-8">
            <div class="grid w-full max-w-5xl overflow-hidden rounded-3xl bg-white shadow-xl ring-1 ring-slate-200 lg:grid-cols-2 dark:bg-neutral-900 dark:ring-neutral-800">
                <!-- Coluna do formulário -->
                <section class="p-6 sm:p-10 lg:p-12">
                    <div class="mb-8">
                        <h1 class="mb-3 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-slate-50">
                            Entrar
                        </h1>
                        <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400">
                            Faça login para continuar de onde parou.
                        </p>
                    </div>

                    <!-- Feedback geral (erro de credenciais / sucesso) -->
                    <div id="feedback" role="alert" class="mb-6 hidden rounded-xl px-4 py-3 text-sm font-medium"></div>

                    <form id="form-login" class="space-y-5" novalidate>
                        <!-- E-mail -->
                        <div>
                            <label for="email" class="mb-2 inline-block text-sm font-semibold text-slate-900 dark:text-slate-50">
                                E-mail
                            </label>
                            <input type="email" id="email" name="email" placeholder="Informe seu e-mail de cadastro..."
                            autocomplete="email" required class="w-full rounded-xl bg-white px-4 py-3 text-sm text-slate-900 outline-1 -outline-offset-1 outline-slate-300
                            placeholder:text-slate-400 transition hover:outline-slate-400 focus:outline-2 focus:-outline-offset-2 focus:outline-teal-600
                            dark:bg-neutral-800 dark:text-slate-50 dark:outline-neutral-700 dark:hover:outline-neutral-600" />
                           <div id="email-erro"></div>
                        </div>

                        <!-- Botão -->
                        <button type="submit" class="w-full cursor-pointer rounded-xl bg-teal-700 px-4 py-3 text-sm font-semibold text-white shadow-sm transition
                        hover:bg-teal-800 active:scale-[0.98] active:bg-teal-900
                        focus:outline-2 focus:outline-offset-2 focus:outline-teal-600">
                            Entrar
                        </button>
                    </form>

                    <p class="mt-8 text-sm text-slate-600 dark:text-slate-400">
                        Ainda não tem conta?
                        <a href="register.html" class="font-semibold text-teal-700 underline-offset-4 hover:underline dark:text-teal-400">
                        Cadastre-se
                        </a>
                    </p>
                </section>

                <aside class="relative hidden overflow-hidden bg-teal-800 p-12 text-white lg:flex lg:flex-col lg:justify-end">
                    <div class="absolute -right-16 -top-16 h-64 w-64 rounded-full bg-teal-600/50"></div>
                    <div class="absolute -left-10 top-1/3 h-40 w-40 rounded-full bg-teal-900/60"></div>
                    <div class="absolute right-12 top-1/2 h-24 w-24 rounded-2xl rotate-12 bg-amber-300/90"></div>
                    <div class="relative">
                        <p class="mb-3 text-3xl font-extrabold leading-tight tracking-tight">
                            Bom ver você por aqui.
                        </p>
                        <p class="max-w-xs text-base leading-relaxed text-teal-100">
                            Use o e-mail que você cadastrou para acessar sua conta.
                        </p>
                    </div>
                </aside>

            </div>
        </main>

        <!-- Configuração de validação-->
        <script src="https://unpkg.com/just-validate@4.3.0/dist/just-validate.production.min.js"></script>
        <script type="module" src="js/login.js"></script>
    </body>
</html>
